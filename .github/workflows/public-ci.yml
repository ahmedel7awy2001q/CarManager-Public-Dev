name: Public Safe Android CI

on:
  push:
    branches: [main, 'product/**', 'public-only/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-safe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Guard, tests, lint, debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Public-safe guard
        run: bash scripts/public_safe_guard.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Build public debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-safe-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload publicdev debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CarManager-publicdev-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
