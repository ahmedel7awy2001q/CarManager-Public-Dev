name: Public Complete Product Batch

on:
  push:
    branches:
      - product/update-batch-2026-09-12

permissions:
  contents: write

concurrency:
  group: public-complete-product-batch
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: ${{ startsWith(github.event.head_commit.message, '[PUBLIC-ONLY] Run remaining CarManager product batch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout public-safe feature branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: product/update-batch-2026-09-12

      - name: Configure product commits
        run: |
          git config user.name "CarManager Public Dev Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Guard public-safe baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationIdSuffix = ".publicdev"' app/build.gradle.kts
          ! find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pfx' \) -print -quit | grep -q .
          ! grep -R -n -E 'CARMANAGER_SIGNING_PASSWORD|CarManager-release\.p12' app .github --exclude='public-complete-product-batch.yml' --exclude='apply_remaining_product_batch.py'
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java/com/ahmed/carmanager/data/local

      - name: Apply remaining product changes in logical commits
        run: python .github/scripts/apply_remaining_product_batch.py

      - name: Prepare offline-safe Maps configuration
        run: cp local.defaults.properties secrets.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compile unit test lint and build
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Verify final data-safety invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationIdSuffix = ".publicdev"' app/build.gradle.kts
          grep -q 'VehicleLifecyclePolicy' app/src/main/java/com/ahmed/carmanager/ui/CarManagerViewModel.kt
          grep -q 'confirmValueChange' app/src/main/java/com/ahmed/carmanager/ui/GarageScreen.kt
          grep -q 'VehicleTechnicalCoverageEvaluator' app/src/main/java/com/ahmed/carmanager/ui/GarageScreen.kt
          grep -q 'StorefrontVehicleAliasCatalog.marketProfiles' app/src/main/java/com/ahmed/carmanager/ui/VehicleMarketIdentity.kt
          grep -q 'softDelete(vehicleId' app/src/main/java/com/ahmed/carmanager/data/repository/RoomVehicleRepository.kt
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java/com/ahmed/carmanager/data/local
          ! find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pfx' \) -print -quit | grep -q .

      - name: Upload public debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarManager-publicdev-complete-batch
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Push validated product commits
        run: git push origin HEAD:product/update-batch-2026-09-12
